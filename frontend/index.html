<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Booktracker — tu vida como lector: biblioteca, descubrimientos y estadísticas." />
    <meta name="theme-color" content="#140E0A" />
    <title>Booktracker</title>
    <script>
      try {
        var t = localStorage.getItem('bt-theme')
        if (t === 'paper' || t === 'ink') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
